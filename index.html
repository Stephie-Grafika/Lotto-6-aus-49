<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">    
    <title>Lotto: 6 aus 49</title>
    <!-- Bootstrap CSS-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <!-- Online bei Netlify unter https://lotto6aus49.netlify.app-->
<body class="container py-5">
    <header class="pb-3">
        <h1>Lotto: 6 aus 49</h1>
        <hr>
    </header>
    <main>
        <p>Bitte wählen Sie 6 verschiedene Zahl zwischen 1 und 49 aus!</p>
        <!-- onsubmit löst Funktion aus, wenn Formular durch Button angesendet wird -->
        <form onsubmit="zahlTippen(); return false;">
            <div class="input-group-prepend">
                <input id="tippZahl1" type="number" required placeholder="1. Zahl" class="form-control" >
                <input id="tippZahl2" type="number" required placeholder="2. Zahl" class="form-control" >
                <input id="tippZahl3" type="number" required placeholder="3. Zahl" class="form-control" >
                <input id="tippZahl4" type="number" required placeholder="4. Zahl" class="form-control" >
                <input id="tippZahl5" type="number" required placeholder="5. Zahl" class="form-control" >
                <input id="tippZahl6" type="number" required placeholder="6. Zahl" class="form-control" >
            </div>
        <button class="btn btn-dark mt-3" >Tipp&nbsp;abgeben</button>
        </form>
        <p id="ergebnis"></p>
    </main>
    <footer class="pt-5">
        <hr>
        <p>© Stephanie Ott, 10.12.2025</p>
    </footer>
    <!-- Javascript für Funktionalität verknüpfen -->
    <script src="script.js"></script>
    <!-- Konfetti https://www.npmjs.com/package/js-confetti -->
    <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
</body>
</html>
